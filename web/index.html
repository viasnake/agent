<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Agent</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div id="login" class="login" hidden>
      <form id="login-form" class="login-card">
        <span class="eyebrow">LOCAL WORKSPACE</span>
        <h1>Agent</h1>
        <label
          >認証情報<input
            id="password"
            type="password"
            autocomplete="current-password"
            required /></label
        ><button type="submit">ログイン</button>
        <p id="login-error" role="alert"></p>
      </form>
    </div>
    <div id="app" hidden>
      <header>
        <a href="/" class="brand">Agent<span>PI DURABLE</span></a
        ><span id="connection" role="status">接続を確認しています</span
        ><button id="logout" class="quiet">ログアウト</button>
      </header>
      <div class="layout">
        <aside>
          <div class="aside-heading">
            <h2>会話</h2>
            <button id="new-conversation" class="quiet">＋ 新規</button>
          </div>
          <nav id="conversations" aria-label="会話一覧"></nav>
        </aside>
        <main>
          <p id="error" class="notice error" role="alert" hidden></p>
          <div class="detail-heading">
            <div>
              <span id="state" class="badge"></span>
              <h1 id="title">何を進めましょうか。</h1>
            </div>
            <div id="actions" class="actions"></div>
          </div>
          <p id="detail" class="subtle"></p>
          <button id="earlier" class="quiet" hidden>以前の記録を読む</button>
          <div id="transcript" aria-live="polite"></div>
          <pre id="live" class="subtle"></pre>
          <form id="message-form">
            <label
              >依頼・追加指示<textarea
                id="message"
                rows="5"
                maxlength="64000"
                placeholder="CSV の整形、文章の作成、コードの修正など"
                required
              ></textarea></label
            ><label
              >添付ファイル<input id="attachments" type="file" multiple
            /></label>
            <div class="actions">
              <button id="send" type="submit">送る</button
              ><span id="input-status" class="subtle"></span>
            </div>
          </form>
          <section class="deliverables">
            <div class="aside-heading">
              <h2>ファイル</h2>
              <button id="refresh-files" class="quiet">更新</button>
            </div>
            <div id="files" class="artifact-grid"></div>
          </section>
        </main>
      </div>
    </div>
  </body>
</html>
