name: Verify
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: npm
      - name: Install test prerequisites
        run: sudo apt-get update && sudo apt-get install -y bubblewrap tmux python3
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify formatting, types, build, tests, and CLI startup
        run: npm run verify
        env:
          AGENT_REQUIRE_SANDBOX: "1"
      - name: Check dependency manifests remain unchanged
        run: git diff --exit-code -- package.json package-lock.json
