name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap tmux
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run check
      - run: npm run build
      - name: Run the Firecracker helper and guest runner unit tests
        run: python3 -m unittest discover -s tests/firecracker -p 'test_*.py'
      - run: npm test
        env:
          AGENT_REQUIRE_SANDBOX: "1"
