#cloud-config
hostname: personal-agent
ssh_pwauth: false
disable_root: true
users:
  - name: agent-admin
    groups: [sudo]
    shell: /bin/bash
    lock_passwd: true
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    ssh_authorized_keys: [__SSH_KEY__]
  - name: agent-control
    uid: 980
    system: true
    lock_passwd: true
    shell: /usr/sbin/nologin
    homedir: /nonexistent
    no_create_home: true
  - name: agent-work
    uid: 981
    system: true
    lock_passwd: true
    shell: /usr/sbin/nologin
    homedir: /srv/agent-data/work/home
    no_create_home: true
package_update: true
packages:
  - ca-certificates
  - curl
  - git
  - python3
  - python3-venv
  - python3-pip
  - nftables
  - apparmor
  - sudo
  - util-linux
  - fonts-noto-cjk
  - poppler-utils
  - libnss3
  - libatk1.0-0t64
  - libatk-bridge2.0-0t64
  - libcups2t64
  - libdrm2
  - libxkbcommon0
  - libxcomposite1
  - libxdamage1
  - libxfixes3
  - libxrandr2
  - libgbm1
  - libasound2t64
  - libpango-1.0-0
  - libcairo2
write_files:
  - path: /etc/modules-load.d/agent-fw-cfg.conf
    permissions: "0644"
    content: qemu_fw_cfg
  - path: /usr/local/libexec/agent-initial-disk
    permissions: "0700"
    encoding: b64
    content: __DISK_SCRIPT__
  - path: /etc/apt/apt.conf.d/52agent-no-reboot
    permissions: "0644"
    content: |
      Unattended-Upgrade::Automatic-Reboot "false";
runcmd:
  - [python3, /usr/local/libexec/agent-initial-disk]
